<!-- ==========================================================================
     THE POSTER
     ==========================================================================
     One page, one job: an A4 portrait sheet with a QR code that opens the
     party site. Printed and taped around the room, or shown full screen so
     people can scan it off a monitor. Self contained on purpose: no
     styles.css, no app.js, no Supabase, nothing that can fail between the
     owner and a printer at 23:40 the night before.

     Slimmed on the owner's request (2026-09-25): the steps, the footer, the
     spelled-out address all gone. What remains is the course strip, one
     headline, and the code, at sizes readable across a room. The QR carries
     the address, so the address is not written twice.

     The QR encodes https://sirsirio.github.io/thesis-defended-liver-pending/
     at error correction H, which tolerates 30% damage. The course badge
     parked in the middle covers about 4% of the area, so every camera app
     reads straight past it. If the site ever moves, the code must be
     regenerated, not edited.

     Two print buttons, not a settings page. Colour prints the parody in DTU
     red; black and white swaps every drop of colour for ink-friendly black.
     The QR itself is black in both, because a QR code that is not dark on
     light is a QR code that does not scan.
     ========================================================================== -->

<style>
  :root {
    --accent: #990000;
    --ink: #131315;
    --ink-dim: #5b5b63;
    --paper: #ffffff;
  }
  body.bw {
    --accent: #000000;
    --ink: #000000;
    --ink-dim: #333333;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #1a1a1e;
    font-family: "Segoe UI", -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; padding: 28px 12px 60px;
  }
  .mono { font-family: "Cascadia Mono", ui-monospace, "SF Mono", Consolas, monospace; }

  /* Screen-only controls. Gone entirely in print. */
  .tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .tools button {
    appearance: none; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font: 500 14px/1 "Segoe UI", system-ui, sans-serif;
    padding: 12px 18px; border-radius: 999px;
  }
  .tools button:hover { background: rgba(255,255,255,0.16); }
  .tools .hint {
    flex-basis: 100%; text-align: center;
    color: rgba(255,255,255,0.55); font-size: 12.5px; margin-top: 2px;
  }

  /* The sheet. Fixed at A4 so what is on screen is what lands on paper.
     Everything lives inside a 14mm inset: home printers cannot reach the
     edges, and nothing bleeding means nothing clipped. */
  .sheet {
    width: 210mm; min-height: 297mm;
    background: var(--paper);
    padding: 14mm 16mm;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  @media (max-width: 840px) {
    .sheet { transform: scale(0.44); transform-origin: top center; margin-bottom: calc(-297mm * 0.56); }
  }

  .head { display: flex; align-items: center; gap: 5mm; align-self: stretch; }
  .badge {
    display: grid; place-items: center;
    width: 22mm; height: 15mm;
    background: var(--accent); color: #fff;
    font-size: 19pt; letter-spacing: 0.02em;
    border-radius: 1.5mm;
  }
  .head__t { font-size: 16pt; font-weight: 600; }
  .head__d { margin-left: auto; font-size: 13pt; color: var(--ink-dim); }

  .rule { border: 0; border-top: 0.8mm solid var(--accent); margin: 7mm 0 0; align-self: stretch; width: 100%; }

  .headline {
    margin: 12mm 0 0;
    font-size: 44pt; font-weight: 750; letter-spacing: 0.01em;
    line-height: 1.05; text-transform: uppercase;
    text-align: center;
  }
  .headline em { font-style: normal; color: var(--accent); }

  /* The code takes the rest of the page, centred in whatever the headline
     left over. 158mm wide: about as large as A4 allows with the insets, and
     scannable from across the room. */
  .qrwrap { position: relative; width: 158mm; margin: auto 0; padding: 10mm 0; }
  .qrwrap svg { display: block; width: 100%; height: auto; }
  .qrwrap .qrbadge {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 30mm; height: 18mm;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-size: 21pt; border-radius: 2mm;
    border: 2mm solid #fff;
  }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; display: block; }
    .tools { display: none; }
    .sheet { box-shadow: none; width: auto; min-height: 297mm; transform: none; margin: 0; }
  }
</style>
</head>
