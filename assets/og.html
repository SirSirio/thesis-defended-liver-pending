<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<!--
  Source for assets/og-image.png, the picture that shows up when the link is
  pasted into WhatsApp or anywhere else.

  This page is not part of the site. It exists only to be screenshotted at
  exactly 1200 x 630. To regenerate after changing the date or the venue,
  open it at that size and save the result as assets/og-image.png.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    background: #0B0B0C;
    color: #F4F4F5;
    font-family: 'Saira', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
    padding: 72px 80px;
  }
  body::before {
    content: '';
    position: absolute; inset: -40% -20% auto -20%; height: 130%;
    background:
      radial-gradient(48% 52% at 22% 8%, rgba(232,63,72,0.18), transparent 62%),
      radial-gradient(70% 62% at 50% 0%, rgba(153,0,0,0.60), transparent 68%);
  }
  .row { position: relative; display: flex; align-items: center; gap: 18px; }
  .badge {
    display: grid; place-items: center;
    width: 74px; height: 50px;
    background: #990000; color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 21px; border-radius: 2px;
  }
  .dept { font-family: 'IBM Plex Mono', monospace; font-size: 19px; color: #A1A1A6; letter-spacing: 0.02em; }
  h1 {
    position: relative;
    font-size: 118px; font-weight: 800; line-height: 0.94;
    letter-spacing: -0.045em;
    margin-top: auto;
    max-width: 15ch;
  }
  .meta {
    position: relative;
    margin-top: 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 23px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #E83F48;
  }
</style>
</head>
<body>
  <div class="row">
    <span class="badge">03102</span>
    <span class="dept">Department of Graduation Studies</span>
  </div>
  <h1>Thesis Defended, Liver Pending</h1>
  <p class="meta">3 October 2026 &middot; 16:00 &middot; 5 ECTS</p>
</body>
</html>
